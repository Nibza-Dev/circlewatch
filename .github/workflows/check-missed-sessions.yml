name: Check Missed Safety Sessions

on:
  schedule:
    # Every 5 minutes - GitHub Actions' practical minimum interval. Balances
    # "circle gets alerted promptly" against not hammering Firestore/Expo.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check for missed check-ins
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-missed-sessions.js
